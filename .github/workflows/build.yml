name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor project
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon-1.png resources/icon.png
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm i -D @capacitor/assets
          npx cap init "Turf Manager" lk.turfmanager.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: turf-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
